version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - security
    reviewers:
      - presidio-v/maintainers

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    # The CodeQL init/autobuild/analyze steps are separate dependencies to
    # Dependabot but must run at a matching version, so update them together.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
