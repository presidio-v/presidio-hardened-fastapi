[build-system]
requires = ["hatchling", "tomli; python_version < '3.11'"]
build-backend = "hatchling.build"

[project]
name = "presidio-hardened-fastapi"
version = "0.2.0"
description = "A hardened, near drop-in replacement for FastAPI with strong security defaults. Independent of Microsoft Presidio (a data-anonymization toolkit)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Presidio Security", email = "security@presidio.dev" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
]
dependencies = [
    "fastapi>=0.100.0",
    "slowapi>=0.1.9",
    "uvicorn[standard]>=0.20.0",
    "secure>=0.3.0",
    "importlib-metadata>=4.0; python_version < '3.10'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "httpx>=0.24",
    "ruff>=0.4",
    "coverage>=7.0",
    "pytest-cov>=4.0",
    "pip-audit>=2.7.0",
]

[project.urls]
Homepage = "https://github.com/presidio-v/presidio-hardened-fastapi"
Repository = "https://github.com/presidio-v/presidio-hardened-fastapi"
Issues = "https://github.com/presidio-v/presidio-hardened-fastapi/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/presidio_fastapi"]

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "T20", "SIM"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"attack.py" = ["F401", "T201", "E501", "S105", "N806"]
"main.py" = ["F401", "T201", "E501", "S105", "N806", "B008", "B904", "I001", "E401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
